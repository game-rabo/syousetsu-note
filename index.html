<body>
<div class="deco"><i style="left:6%;top:12%;width:70px;height:70px;border-radius:50%;background:var(--ac)"></i><i style="right:8%;top:30%;width:60px;height:60px;border:9px solid #2f6bff;border-radius:50%"></i><i style="left:12%;top:62%;width:70px;height:70px;background:#ff4fd8;clip-path:polygon(50% 0,100% 100%,0 100%)"></i><i style="right:10%;top:72%;width:64px;height:64px;background:#ffb300;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)"></i><i style="left:44%;top:88%;width:40px;height:40px;background:#8a3ffc;transform:rotate(45deg)"></i></div>
<div id="app"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=s=>encodeURIComponent(s).replace(/'/g,'%27');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const LIVES=[];

function seed(){return{eps:[],rooms:[]}}
let D=L('nn_db',null)||seed();D.eps=D.eps.filter(x=>!x.s);D.rooms=D.rooms.filter(x=>!x.s);
let P=L('nn_pf',null)||{name:'未設定',bio:'よろしくお願いします',following:'',followers:0,img:'',n:{like:1,comment:1,follow:1,book:1,sub:1}};
P.r=P.r||{fs:17,th:0,vert:0};
const save=()=>{try{localStorage.setItem('nn_db',JSON.stringify(D));localStorage.setItem('nn_pf',JSON.stringify(P))}catch(e){toast('保存できませんでした（容量不足）')}clearTimeout(save._t);save._t=setTimeout(()=>cloudPush(),1500)};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- Supabase cloud sync ---------- */
const SB='https://mzykelberuojpgyieiqv.supabase.co',KEY='sb_publishable_DgxzZQeKj0tz4EELPlNFeg_TH1CcuQD';
let cloud='未接続',PR={};const hs={},TB=[['nn_episodes','eps'],['nn_rooms','rooms']];
async function api(p,o={}){const r=await fetch(SB+'/rest/v1/'+p,{...o,headers:{apikey:KEY,'Content-Type':'application/json',...(o.headers||{})}});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null}
const BUILD='2026-11-17-c';
/* 接続診断：各テーブル／関数に実際にアクセスして結果を一覧表示 */
async function cloudDiag(){
  const T=['nn_episodes','nn_rooms','nn_profiles','nn_reports','nn_bans','nn_appeals','nn_modlog'];
  const head='<small>接続先：'+esc(SB)+'<br>アプリ版：'+BUILD+'</small>';
  sheet={t:'🔍 接続診断',h:'<div class=pad>'+head+'<p>確認中…</p></div>'};render();
  let rows='',bad=0;
  for(const t of T){let st;
    try{const r=await fetch(SB+'/rest/v1/'+t+'?select=id&limit=1',{headers:{apikey:KEY}}),x=await r.text();let j=null;try{j=JSON.parse(x)}catch(_){}
      const c=(j&&j.code)||'';
      if(r.ok)st='✅ OK';
      else if(c==='42501')st='✅ 存在します（読み取り不可は正常）';
      else{bad++;st='❌ '+r.status+' '+c+' '+String((j&&j.message)||x).slice(0,70)}}
    catch(e){bad++;st='❌ 通信できません'}
    rows+='<div style="padding:5px 0;border-bottom:1px solid #333"><b>'+t+'</b><br><small>'+esc(st)+'</small></div>'}
  let fn;
  try{const r=await fetch(SB+'/rest/v1/rpc/adm_ok',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_pin:''})});
    if(r.ok)fn='✅ 運営用関数 OK';else{bad++;fn='❌ 運営用関数 '+r.status+'（SQLの関数部分が未作成）'}}
  catch(e){bad++;fn='❌ 通信できません'}
  rows+='<div style="padding:5px 0"><b>rpc/adm_ok</b><br><small>'+esc(fn)+'</small></div>';
  const msg=bad?'<p style="color:var(--red)"><b>❌ が'+bad+'件あります。</b>テーブルが無い場合は、上の「接続先」と同じプロジェクトで supabase_setup.sql を実行してください。</p>':'<p><b>✅ すべて正常です。</b>「今すぐ同期」を押してください。</p>';
  sheet={t:'🔍 接続診断',h:'<div class=pad>'+head+msg+'<div class=card style="padding:6px 12px">'+rows+'</div></div>'};render()}
/* 同期エラーの原因を判別して表示（原因が分からない問題の再発防止） */
function cerr(e){let m=String(e&&e.message||e),j=null;try{j=JSON.parse(m)}catch(_){}
  const c=(j&&j.code)||'',d=String((j&&(j.message||j.hint))||m);console.error('[cloud]',e);let r;
  if(c==='PGRST205'||c==='42P01'||/schema cache|does not exist|Could not find the table/i.test(d)){const tb=(d.match(/'(?:public\.)?(nn_[a-z_]+)'/)||[])[1]||'';r='接続先['+SB.slice(8,16)+'…]に'+(tb?'テーブル '+tb+' が':'テーブルが')+'ありません。このプロジェクトのSQL Editorで supabase_setup.sql を実行してください（'+(c||'404')+'）'}
  else if(c==='42501'||/row-level security|permission denied/i.test(d))r='権限(RLS)が不足しています。supabase_setup.sql を再実行してください（'+(c||'403')+'）';
  else if(/Invalid API key|JWT|apikey/i.test(d))r='APIキーが無効です。Supabaseの Publishable key を確認してください';
  else if(e instanceof TypeError||/Failed to fetch|NetworkError|Load failed/i.test(m))r='Supabaseに接続できません（通信不良、またはプロジェクトが一時停止中の可能性）';
  else r=d.slice(0,120);
  r='エラー：'+r;if(cerr.l!==r){cerr.l=r;try{toast('☁️ '+r.slice(0,110))}catch(_){}}return r}
const skip=x=>x.s||LIVES.includes(x.author)||(BS.includes(P.name)&&x.author===P.name);
async function cloudPush(){
  try{for(const[t,k]of TB){const rows=[],done=[];
    for(const x of D[k]){if(skip(x)||TOMB().includes(x.id))continue;const{u,...c}=x,j=JSON.stringify(c);if(hs[x.id]===j)continue;x.u=Date.now();rows.push({id:x.id,author:x.author,data:x,updated_at:new Date().toISOString()});done.push([x.id,j])}
    if(rows.length){await api(t+'?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});done.forEach(([i,j])=>hs[i]=j)}}
   if(P.name&&P.name!=='未設定'){const d={bio:P.bio,following:fl(),sup:P.gt||0,tt:P.tt||'',pm:P.prem||0,del:TOMB().slice(-300)},j=JSON.stringify(d);if(hs.pf!==j){await api('nn_profiles?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{id:P.name,data:d,updated_at:new Date().toISOString()}])});hs.pf=j}}
   cloud='同期済み '+new Date().toLocaleTimeString()}catch(e){cloud=cerr(e)}}
function mergeIn(l,r){const o=(r.u||0)>(l.u||0)?{...l,...r}:{...r,...l};
  for(const k of['likes','marks','subs','rd','pv0','pv1','pv2','pv3','vw'])if(l[k]||r[k])o[k]=[...(r[k]||[]).filter(v=>v!==P.name),...(l[k]||[]).filter(v=>v===P.name)];
  if(l.comments||r.comments){const m=new Map();[...(l.comments||[]),...(r.comments||[])].forEach(c=>m.set(c.a+c.d,c));o.comments=[...m.values()]}if(l.parts||r.parts){const m=new Map();[...(l.parts||[]),...(r.parts||[])].forEach(c=>m.set(c.a+c.d,c));o.parts=[...m.values()].sort((a,b)=>a.d-b.d);o.body=o.parts.map(x=>x.t).join('\n\n')}if(l.rx||r.rx){o.rx={};for(const x of new Set([...Object.keys(l.rx||{}),...Object.keys(r.rx||{})]))o.rx[x]=[...((r.rx||{})[x]||[]).filter(v=>v!==P.name),...((l.rx||{})[x]||[]).filter(v=>v===P.name)]}return o}

}

  <div class="body ${['','sepia','dk'][R.th]} ${R.vert?'vert':''} ${R.ff?'mj':''}" style="font-size:${R.fs}px">${hlBody(e)}</div>
  ${pollH(e)}${e.rl?relayH(e):''}${rnav(e)}<div class=acts><button style="color:${liked?'#ff2d78':''}" onclick="like('${e.id}')">${liked?'♥':'♡'} ${e.likes.length}</button><button style="color:${bm?'#2f6bff':''}" onclick="mark('${e.id}')">${bm?'🔖':'📑'}</button><button style="color:${(P.lt||[]).includes(e.id)?'#e08a00':''}" onclick="later('${e.id}')">${(P.lt||[]).includes(e.id)?'📌 あとで':'📍 あとで読む'}</button><button style="color:${(P.dn||{})[e.id]?'#11a35a':''}" onclick="done('${e.id}')">${(P.dn||{})[e.id]?'✅ 読了':'☑ 読了'}</button>${e.author!==me?`<button onclick="rpOpen('ep','${e.id}')">🚩 通報</button><button style="color:#e08a00" onclick="giftOpen('${e.id}')">🎁 投げ銭</button>`:`<button onclick="insOpen('${e.id}')">📊 インサイト</button>`}</div>

let AC=null,BG=null,BGk=0,SLP=0;
function bgm(){BGk=(BGk+1)%5;if(BG){try{BG.s.stop();BG.o&&BG.o.stop()}catch(e){}BG=null}
  const B=[0,['highpass',1500,.12,0],['lowpass',450,.9,.12],['lowpass',250,1.4,0],['bandpass',700,.9,.2]];
  if(BGk){AC=AC||new(window.AudioContext||window.webkitAudioContext)();const[ty,fq,vol,lf]=B[BGk],n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type=ty;f.frequency.value=fq;const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(AC.destination);let o=null;
    if(lf){o=AC.createOscillator();o.frequency.value=lf;const og=AC.createGain();og.gain.value=vol*.6;o.connect(og);og.connect(g.gain);o.start()}s.start();BG={s,o}}
  toast(['🎵 BGMなし','🌧 雨の音','🌊 波の音','🔥 焚き火の音','🌬 風の音'][BGk]);render()}

/* ---------- 収益ポイント＆アナリティクス（本人のみ） ---------- */
const RV={v:1,l:3,m:4,c:5,r:1}; // 基本：閲覧+1 いいね+3 ブクマ+4 感想+5 リアクション+1（上限なし）
const HIT=[[2e4,3,'大ヒット'],[5e3,2,'ヒット'],[1e3,1.5,'人気作'],[0,1,'']]; // 読者数によるヒット倍率
const MSB=[[100,30],[500,100],[1e3,300],[5e3,1500],[1e4,4e3],[5e4,2e4],[1e5,5e4]]; // 読者数マイルストーンボーナス
const dk=t=>{const d=new Date(t);return String(d.getFullYear()*1e4+(d.getMonth()+1)*100+d.getDate())};
const days=n=>[...Array(n)].map((_,i)=>Date.now()-(n-1-i)*864e5);
const vwDay=(e,k)=>(e.vw||[]).filter(x=>x.split('@')[1].slice(0,8)===k).length;
const pct=(a,b)=>b?Math.round(a/b*1000)/10+'%':'-';
// 閲覧記録：読者×日ごとに1回（名前@年月日時）
const _seen=seen;seen=function(id){_seen(id);const e=D.eps.find(x=>x.id===id);if(!e||e.author===P.name||P.name==='未設定')return;
  const t=new Date(),k=String(t.getFullYear()*1e6+(t.getMonth()+1)*1e4+t.getDate()*100+t.getHours()),a=e.vw=e.vw||[];
  if(a.some(x=>x.startsWith(P.name+'@'+k.slice(0,8))))return;a.push(P.name+'@'+k);if(a.length>3000)a.shift();e.u=Date.now();save()};
function evStat(e){const a=e.author,ok=n=>n&&n!==a&&n!=='未設定'&&!BS.includes(n),vw=e.vw||[],per={};vw.forEach(x=>{const n=x.split('@')[0];if(ok(n))per[n]=(per[n]||0)+1});(e.rd||[]).forEach(n=>{if(ok(n)&&!per[n])per[n]=1});
  const vi=Object.keys(per).length,vd=Object.values(per).reduce((t,d)=>t+Math.min(d,3),0),lk=e.likes.filter(ok).length,mk=e.marks.filter(ok).length,cm=e.comments.filter(c=>ok(c.a)&&!c.del).length,rx=Object.values(e.rx||{}).reduce((t,l)=>t+l.filter(ok).length,0),
  base=vd*RV.v+lk*RV.l+mk*RV.m+cm*RV.c+rx*RV.r,hm=HIT.find(h=>vi>=h[0]);
  return{vw:Math.max(vw.length,(e.rd||[]).length),vi,lk,mk,cm,rx,eng:lk+mk+cm+rx,base,hm:hm[1],ht:hm[2],pt:Math.floor(base*hm[1])}}
function weekly2(){const t=new Date(),off=(t.getDay()+6)%7,wk=ymd(t.getTime()-off*864e5);if(P.wkd===wk)return 0;P.wkd=wk;
  const ks=[...Array(7)].map((_,i)=>dk(t.getTime()-(off+7-i)*864e5)),sc={};
  D.eps.filter(e=>e.author!=='運営'&&!e.hid).forEach(e=>{sc[e.author]=(sc[e.author]||0)+ks.reduce((a,k)=>a+vwDay(e,k),0)});
  const i=Object.entries(sc).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3).findIndex(x=>x[0]===P.name);if(i<0)return 0;const b=[300,150,80][i];toast('🏅 先週の閲覧ランキング '+(i+1)+'位！ +'+b+'pt');boom();return b}
function settle(){const me=P.name;if(me==='未設定'||myBan())return;const rv=P.rv=P.rv||{},ms=P.msd=P.msd||{};let add=0,hit=0;
  D.eps.filter(e=>e.author===me&&!e.hid&&!(RC[e.id]>=3)).forEach(e=>{const s=evStat(e),o=rv[e.id]||0;if(s.pt>o){add+=s.pt-o;rv[e.id]=s.pt}
    MSB.forEach(([n,b])=>{const k=e.id+':'+n;if(s.vi>=n&&!ms[k]){ms[k]=1;add+=b;hit=n}})});
  if(hit){boom();toast('🎉 読者'+hit+'人達成！ボーナス獲得')}else if(add>0)toast('💰 収益ポイント +'+add+'pt');
  add+=weekly2();if(prem())add=Math.floor(add*1.1);if(add>0){P.pt=(P.pt||0)+add;P.rvt=(P.rvt||0)+add;save()}else if(P.wkd)save()}

const revSec=()=>sec('💰 収益ポイント',`<div class=empty>累計 <b>${P.rvt||0}pt</b>（上限なし）<br>基本：閲覧 +${RV.v}／いいね +${RV.l}／ブクマ +${RV.m}／感想 +${RV.c}／リアクション +${RV.r}<br>🔥 ヒット倍率：読者1,000人で×1.5／5,000人で×2／20,000人で×3<br>🎉 マイルストーン：読者100人 +30／500人 +100／1,000人 +300／5,000人 +1,500／1万人 +4,000／5万人 +20,000／10万人 +50,000pt<br>🏅 週間ランキング：先週の閲覧数TOP3に +300／+150／+80pt<br><small>不正対策：同じ人からの閲覧は1作品につき3日分まで。名前未設定・BAN中のユーザーの反応、通報で仮非表示になった作品は対象外です。</small></div>`);
function anSec(){const my=D.eps.filter(e=>e.author===P.name),S=my.map(e=>({e,s:evStat(e)})),tot=S.reduce((a,x)=>({v:a.v+x.s.vw,l:a.l+x.s.lk,g:a.g+x.s.eng}),{v:0,l:0,g:0}),
  d=days(14).map(t=>my.reduce((a,e)=>a+vwDay(e,dk(t)),0)),w1=d.slice(7).reduce((a,b)=>a+b,0),w0=d.slice(0,7).reduce((a,b)=>a+b,0),df=w0?Math.round((w1-w0)/w0*100):null;
  return sec('📊 アナリティクス（本人のみ）',`<div class=lvt><div><b>${w1}</b>閲覧(7日)</div><div><b>${df===null?'-':(df>=0?'+':'')+df+'%'}</b>前週比</div><div><b>${tot.l}</b>いいね</div><div><b>${pct(tot.g,tot.v)}</b>反応率</div></div><div style="padding:0 14px 8px">${bars(d.slice(7),days(7).map(t=>new Date(t).getDate()))}</div>${list(S.sort((a,b)=>b.s.vw-a.s.vw).slice(0,10),x=>`<div class=row onclick="insOpen('${x.e.id}')"><div class=grow><b>${esc(x.e.title)}</b><small>👀${x.s.vw}　❤️${x.s.lk}　💬${x.s.cm}　🔖${x.s.mk}　💰${(P.rv||{})[x.e.id]||0}pt</small></div>›</div>`,'作品を投稿すると分析が表示されます')}`)}
function insOpen(id){const e=D.eps.find(x=>x.id===id);if(!e||e.author!==P.name)return;const s=evStat(e),vw=e.vw||[],
  fo=vw.filter(x=>((PR[x.split('@')[0]]||{}).following||[]).includes(P.name)).length,hr=[...Array(24)].map((_,h)=>vw.filter(x=>+x.split('@')[1].slice(8,10)===h).length),g=(P.gw||[]).filter(x=>x.e===e.title).reduce((a,x)=>a+x.pt,0),c=(v,t)=>`<div><b>${v}</b>${t}</div>`;
  sheet={t:'📊 インサイト',h:`<div class=pad><b>『${esc(e.title)}』</b><div class=lvt style="margin-top:8px">${c(s.vw,'閲覧')+c(s.vi,'読者数')+c(s.lk,'いいね')+c(s.mk,'ブクマ')+c(s.cm,'感想')+c(s.rx,'リアクション')+c(s.eng,'エンゲージメント')+c(pct(s.eng,s.vw),'反応率')+c(pct(s.lk,s.vw),'いいね率')+c(pct(fo,s.vw),'フォロワー閲覧')+c((P.rv||{})[e.id]||0,'収益pt')+c('×'+s.hm,'ヒット倍率')+c(g+'pt','投げ銭')}</div><h3 style="margin-left:0">日別の閲覧（7日）</h3>${bars(days(7).map(t=>vwDay(e,dk(t))),days(7).map(t=>new Date(t).getDate()))}<h3 style="margin-left:0">時間帯別の閲覧</h3>${bars(hr,hr.map((_,h)=>h%6?'':h))}<small>この画面は作者本人にのみ表示されます。閲覧は読者ごとに1日1回で数えます。</small></div>`};render()}

/* ---------- ストア（課金）：コイン／プレミアム／着せ替え／称号／アイテム ---------- */
const prem=()=>(P.prem||0)>Date.now();
const CXT=[['t10','🍇 ぶどうテーマ',80,'#7b2ff7'],['t11','🍋 レモンテーマ',80,'#f2c400'],['t12','🌿 ミントテーマ',100,'#19b98a'],['t13','🌹 ローズテーマ',100,'#e0245e'],['t14','🌌 ギャラクシーテーマ',150,'#3a3fd8'],['t15','🍑 ピーチテーマ',100,'#ff8a80'],['t16','🌃 ナイトブルーテーマ',120,'#1e3a8a'],['t17','🍵 抹茶テーマ',100,'#6b9a2a'],['t18','🪸 コーラルテーマ',100,'#ff6f61'],['t19','⚫ モノクロテーマ',120,'#444444'],['t20','🔶 ゴールドリッチテーマ',200,'#c9a227'],['t21','🌊 ターコイズテーマ',150,'#00b8c4']];
const CXF=[['f10','💎 ダイヤ枠',100,'0 0 0 3px #7ee8ff,0 0 16px 4px #b9f3ff'],['f11','🔥 炎枠',120,'0 0 0 3px #ff5a1f,0 0 18px 5px #ffb300'],['f12','❄️ 氷枠',100,'0 0 0 3px #bfe9ff,0 0 14px 4px #5cc8ff'],['f13','🌸 桜枠',100,'0 0 0 3px #ffc1d9,0 0 16px 4px #ff7eb3'],['f14','👑 王冠枠',200,'0 0 0 3px #ffd200,0 0 0 6px #fff,0 0 18px 6px #ffb300'],['f15','⚡ 雷枠',150,'0 0 0 3px #ffee58,0 0 20px 6px #7c4dff'],['f16','🌈 虹ネオン枠',250,'0 0 0 3px #ff4fa3,0 0 0 6px #2fd4ff,0 0 0 9px #a6f21a,0 0 18px 8px #ffd200'],['f17','🏅 黄金二重枠',180,'0 0 0 3px #b8860b,0 0 0 6px #ffd700,0 0 14px 4px #fff2a8']];
const CX=[...CXT,...CXF],SHA=()=>SH.concat(CX.map(x=>[x[0],x[1],0,x[3]]));
const TTL=[['🌟','新星作家',30],['🖋','文豪',80],['📚','本の虫',40],['🌙','夜更かし作家',40],['🐉','伝説の語り部',150],['💫','星屑',30],['🍀','幸運の使者',60],['🎭','物語の魔術師',100],['🔥','情熱の筆',50],['🧙','言葉の魔法使い',120]];
const ITM=[['bst24','🚀','作品ブースト 24時間',50,'ホームの「ブースト中の作品」に24時間表示'],['bst72','🚀','作品ブースト 72時間',120,'3日間おすすめ枠に表示'],['bst168','🌠','作品ブースト 1週間',250,'7日間おすすめ枠に表示'],['dr','📝','下書き枠 +20',60,'下書き箱の上限を20件拡張（何度でも）'],];[CXT,CXF,TTL].forEach(a=>a.forEach(x=>x[2]*=5));ITM.forEach(x=>x[3]*=5); // 価格はすべてポイント
let STP=0;const stSeg=i=>{STP=i;render()};
const srow=(e,n,d,b)=>`<div class=row style="cursor:default"><span style="font-size:26px">${e}</span><div class=grow><b>${n}</b><small>${d}</small></div>${b}</div>`;
function spend(n,name){if(myBan()){banSheet(myBan());return 0}if((P.pt||0)<n){STP=0;toast('ポイントが足りません（ミッション・収益・おみくじで貯めよう）');render();return 0}P.pt-=n;(P.ord=P.ord||[]).unshift({d:Date.now(),n:name,c:n});P.ord=P.ord.slice(0,60);return 1}
function buyPrem(){if(!spend(2000,'プレミアム30日'))return;P.prem=Math.max(Date.now(),P.prem||0)+30*864e5;save();boom();toast('👑 プレミアムが始まりました');render()}
function buyCx(id){const x=CX.find(v=>v[0]===id),own=P.own=P.own||[];if(!own.includes(id)){if(!spend(x[2],x[1]))return;own.push(id);boom();toast(x[1]+' を手に入れた！')}equip(id)}
function buyTt(i){const t=TTL[i],o=P.tts=P.tts||[],k=t[0]+t[1];if(!o.includes(k)){if(!spend(t[2],'称号 '+k))return;o.push(k);boom()}P.tt=P.tt===k?'':k;save();toast(P.tt?'称号を装備しました':'称号を外しました');render()}
function buyItm(id){const x=ITM.find(v=>v[0]===id);if(id.startsWith('bst'))return bstPick(id);if(!spend(x[3],x[2]))return;P.dx=(P.dx||0)+20;save();boom();toast(x[2]+' を購入しました');render()}
function bstPick(id){const m=D.eps.filter(e=>e.author===P.name);if(!m.length)return toast('投稿した作品がありません');sheet={t:'🚀 ブーストする作品を選択',h:list(m,e=>`<div class=row onclick="bstDo('${id}','${e.id}')">${cov(e,40,54)}<div class=grow><b>${esc(e.title)}</b>${e.bst>Date.now()?'<small>ブースト中（延長されます）</small>':''}</div></div>`)};render()}
function bstDo(id,eid){const x=ITM.find(v=>v[0]===id),e=D.eps.find(v=>v.id===eid),h={bst24:24,bst72:72,bst168:168}[id];if(!e||!spend(x[3],x[2]))return;e.bst=Math.max(Date.now(),e.bst||0)+h*36e5;e.u=Date.now();sheet=null;save();boom();toast('🚀 『'+e.title+'』をブーストしました');render()}
function claimDaily(){const d=ymd(Date.now());if(P.dbn===d)return toast('今日は受け取り済みです');P.dbn=d;const v=prem()?100:10;P.pt=(P.pt||0)+v;save();boom();toast('🎁 ログインボーナス +'+v+'pt'+(prem()?'（プレミアム）':''));render()}
const cxRow=x=>{const own=(P.own||[]).includes(x[0]),on=P.th===x[0]||P.fr===x[0],t=x[0][0]=='t';return srow(`<span style="display:inline-block;width:24px;height:24px;border-radius:50%;background:${t?x[3]:'#8884'};${t?'':'box-shadow:'+x[3]}"></span>`,x[1],t?'アクセントカラー':'アイコンの枠',`<button class="btn${own?' o':''}" onclick="buyCx('${x[0]}')">${on?'装備中':own?'装備':x[2]+'pt'}</button>`)};
function storeH(){const pm=prem(),hd=`<div class=pad><div class=card style="padding:14px;text-align:center"><small>所持ポイント</small><br><b style="font-size:26px">⭐ ${P.pt||0}pt</b>${pm?`<br><span class=badge style="background:#e08a00">👑 PREMIUM　あと${Math.ceil((P.prem-Date.now())/864e5)}日</span>`:''}<div style="margin-top:8px"><button class="btn o" onclick="claimDaily()">🎁 ログインボーナス（${pm?100:10}pt）</button></div></div></div>`;let b;
  if(STP==0)b=sec('⭐ ポイントの貯め方',[['📖','読まれる・反応される','閲覧+1／いいね+3／ブクマ+4／感想+5。ヒット倍率とマイルストーンもあります'],['🎁','投げ銭をもらう','作品ページやライブで受け取れます'],['🎯','デイリーミッション','毎日4つ達成で合計 +60pt'],['🎴','おみくじ','毎日1回 5〜50pt'],['📚','月間読書チャレンジ','達成で +50pt'],['🏅','週間ランキング','先週の閲覧TOP3に +300／+150／+80pt'],['⏱','25分集中','執筆タイマーで +20pt']].map(x=>srow(x[0],x[1],x[2],'')).join('')+`<div class=empty>このアプリのお金の単位は「ポイント」だけです。実際のお金は使いません。</div>`);
  else if(STP==1)b=sec('👑 プレミアム（30日・2,000pt）',[['🚫','広告バー非表示','ホーム画面の広告を消します'],['🎁','ログインボーナス 100pt','通常は10pt'],['💰','収益ポイント +10%','獲得した収益に10%上乗せ'],['📝','下書き枠 +30','下書き箱の上限が拡大'],['👑','PREMIUMバッジ','名前の横に表示']].map(x=>srow(x[0],x[1],x[2],'')).join('')+`<div style="padding:12px"><button class="btn w" style="margin:0;width:100%" onclick="buyPrem()">${pm?'30日延長する':'プレミアムを始める'}　2,000pt</button></div>`);
  else if(STP==2)b=sec('🎨 テーマ',CXT.map(cxRow).join(''))+sec('🖼 アイコン枠',CXF.map(cxRow).join(''))+sec('🛒 ポイントショップ',shopH());
  else if(STP==3)b=sec('🏷 称号（名前の横に表示）',TTL.map((t,i)=>{const k=t[0]+t[1],own=(P.tts||[]).includes(k);return srow(t[0],t[1],'みんなに見える称号',`<button class="btn${own?' o':''}" onclick="buyTt(${i})">${P.tt===k?'装備中':own?'装備':t[2]+'pt'}</button>`)}).join(''));
  else if(STP==4)b=sec('🧰 アイテム',ITM.map(x=>srow(x[1],x[2],x[4],`<button class=btn onclick="buyItm('${x[0]}')">${x[3]}pt</button>`)).join(''));
  else b=sec('🧾 購入履歴',list((P.ord||[]).filter(o=>o.c>0),o=>srow('🛍',esc(o.n),ago(o.d),`<b>−${o.c}pt</b>`),'購入履歴はありません'));
  return hd+seg(['⭐貯め方','👑プレミアム','🎨着せ替え','🏷称号','🧰アイテム','🧾履歴'],STP,'stSeg')+b}
const storeSec=()=>sec('🛍 ストア',`<div class=empty>所持 ⭐${P.pt||0}pt${prem()?'　👑プレミアム中':''}</div><div style="padding:0 14px 12px"><button class="btn w" style="margin:0;width:100%" onclick="go('store','x')">ストアを開く</button></div>`);
const supB=n=>{const t=n===P.name?P.gt||0:(PR[n]||{}).sup||0,s=SUP.find(x=>t>=x[0]),tt=n===P.name?P.tt:(PR[n]||{}).tt,pm=n===P.name?prem():((PR[n]||{}).pm||0)>Date.now();
  return (pm?' <span class=badge style="background:#e08a00">👑</span>':'')+(tt?` <span class=badge style="background:#8a3ffc">${esc(tt)}</span>`:'')+(s?` <span class=badge style="background:#e08a00">${s[1]}${s[2]}サポーター</span>`:'')};

/* ---------- 6分以上画面を開いていなかったら自動リロード ---------- */
if(P.cn){P.pt=(P.pt||0)+P.cn*5;P.cn=0;save()} // 旧コインはポイントに換算（1コイン=5pt）
let HID_AT=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden){HID_AT=Date.now();try{save()}catch(e){}}else{const t=HID_AT;HID_AT=0;if(t&&Date.now()-t>=36e4){try{sessionStorage.setItem('nn_rl','1')}catch(e){}location.reload()}}});
try{if(sessionStorage.getItem('nn_rl')){sessionStorage.removeItem('nn_rl');setTimeout(()=>toast('🔄 しばらく開いていなかったので最新の状態に更新しました'),800)}}catch(e){}

/* ---------- navigation ---------- */
const TABS=[['🏠','ホーム',home],['🔍','検索',search],['🏆','ランキング',ranking],['✏️','投稿',post],['📚','本棚',library],['🙂','プロフ',profile]];
const V={store:()=>storeH(),ep:id=>{if(P.last!==id){P.last=id;save()}mis('read');rlog(id);seen(id);return reader(id)},room:roomDetail,author,edit:()=>ed('e')};
function go(t,a){stack.push({t,a:decodeURIComponent(a)});render(1)}
const back=()=>{stack.pop();render(1)};
const setTab=i=>{tab=i;stack=[];render(1)};
function render(top){if(top&&window.speechSynthesis)speechSynthesis.cancel();
  const y=scrollY,t=stack[stack.length-1];let h;
  if(t){const T={ep:'',room:'Room詳細',author:t.a,edit:'作品を編集',store:'💎 ストア'}[t.t];h=`<div class=nb><button onclick="back()">‹ 戻る</button><b>${esc(T)}</b></div>`+V[t.t](t.a)}
  else h=TABS[tab][2]();
  $('#app').innerHTML=`<main>${h}</main>${lv?'':`<nav>${TABS.map((x,i)=>`<button class="${i==tab&&!stack.length?'on':''}" onclick="setTab(${i})"><span>${x[0]}${i==TABS.length-1&&notifs().length?'<u class=nd></u>':''}</span>${x[1]}</button>`).join('')}</nav>`}${lv?'<div id=live class=live></div>':''}${sheet?sheetHTML():''}`;
  if(lv)renderLive();
  scrollTo(0,top?0:y);if(top&&t&&t.t==='ep')resume(t.a);if(top&&!t&&tab==1&&!SR.q){const i=$('#sqi');if(i)i.focus()}
}
if(!P.sn)snap();applyTheme();applyDk();render();modInit();cloudPull().then(cloudPush);setInterval(cloudPull,30000);
</script>
